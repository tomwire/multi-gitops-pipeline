# =============================================================================
# Multi-Stage GitOps Pipeline - CD Promotion to Dev (Auto-Sync)
# =============================================================================
name: CD — Promote to Dev (Auto-Sync)

on:
  workflow_run:
    workflows: ["CI/CD - Multi-Stage Delivery Pipeline"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: write
  actions: read

env:
  AWS_REGION: "us-east-2"
  ECR_REPOSITORY: order-service-api
  BOT_NAME: gitops-pipeline-bot
  BOT_EMAIL: bot@multi-gitops-pipeline.dev

jobs:
  auto-promote-dev:
    name: Auto-Promote to Dev
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only promote when CI actually pushed to ECR (credentials were configured)
      - name: Skip promotion without AWS credentials
        id: check-creds
        run: |
          if [[ "${{ secrets.AWS_ROLE_ARN }}" == "" ]]; then
            echo "Skipping dev promotion — no AWS_ROLE_ARN secret configured."
            echo "set=false" >> $GITHUB_OUTPUT
          else
            echo "AWS credentials available, proceeding with promotion."
            echo "set=true" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        if: steps.check-creds.outputs.set == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.check-creds.outputs.set == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Determine new tag
        if: steps.check-creds.outputs.set == 'true'
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "PROMOTE_TAG=v$(date +%Y%m%d)-${COMMIT_SHA:0:8}" >> $GITHUB_ENV

      - name: Update dev overlay image reference
        if: steps.check-creds.outputs.set == 'true'
        run: |
          OVERLAY_FILE="k8s-manifests/overlays/dev/kustomization.yaml"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          FULL_IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${PROMOTE_TAG}"

          sed -i "s|newTag: [a-zA-Z0-9_.-]*|newTag: ${PROMOTE_TAG}|g" "$OVERLAY_FILE"
          sed -i "s|newName: [a-zA-Z0-9_./:-]*|newName: ${FULL_IMAGE}|g" "$OVERLAY_FILE"

          echo "Updated dev overlay to: ${FULL_IMAGE}"

      - name: Commit and push dev overlay change
        if: steps.check-creds.outputs.set == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🚀 CD: promote image ${{ env.PROMOTE_TAG }} to dev"
          file_pattern: k8s-manifests/overlays/dev/kustomization.yaml
          commit_user_name: ${{ env.BOT_NAME }}
          commit_user_email: ${{ env.BOT_EMAIL }}
          commit_author: ${{ env.BOT_NAME }} <${{ env.BOT_EMAIL }}>

      - name: Notify ArgoCD (dev should auto-sync)
        if: steps.check-creds.outputs.set == 'true'
        run: echo "✅ Dev overlay updated — ArgoCD will auto-sync via selfHeal"
